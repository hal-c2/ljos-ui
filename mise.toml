# Tooling for Ljós. `mise install` installs it; tasks live in mise-tasks/.
[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
# Runs CI's Rust tests: each in a process of its own, so one that hangs is named (.config/nextest.toml).
"github:nextest-rs/nextest" = "cargo-nextest-0.9.151"

[env]
CARGO_TERM_COLOR = "always"
