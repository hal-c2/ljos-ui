[package]
name = "ljos_acceptance_example_steps"
description = "Step adapter of the example acceptance suite: maps its wording onto Ljos's Backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ljos-acceptance-example"
path = "src/main.rs"

[dependencies]
ljos_bdd = { path = "../../../crates/ljos_bdd" }
# The step macros expand to paths in `cucumber`, so an adapter names it. Keep
# the version equal to the pin in the repository's root Cargo.toml.
cucumber = "0.23.0"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# This crate is not a member of the repository's workspace (that one is
# `crates/*`), so it is a workspace of its own. `mise run features:acceptance`
# seeds its Cargo.lock from the root one, so both resolve the same versions.
[workspace]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
