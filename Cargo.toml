[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
exclude = ["vendor", "third_party/filmcraft"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/olafura/ljos-ui"
publish = false

# Shared version pins. Crates take these with `foo.workspace = true`.
# egui tracks the latest release (ARCHITECTURE.md D9); upgrade in one PR per release.
[workspace.dependencies]
# Parser (vendored fork of oxc_parser 0.144 with the QML mode, see vendor/FORK.md)
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_diagnostics = "0.144"
oxc_parser = "0.144"
oxc_semantic = "0.144"
oxc_span = "0.144"
oxc_str = "0.144"
oxc_syntax = "0.144"

# Engine
slotmap = "1.1.1"
smallvec = "1.16"
bitflags = "2.13"
rquickjs = { version = "0.14.0", default-features = false }
salsa = "0.28.5"
postcard = { version = "1.1", features = ["alloc"] }

# Rendering, host and accessibility
egui = "0.36.2"
eframe = "0.36.2"
egui_kittest = "0.36.2"
# Must match egui's accesskit: its types do not interoperate across minor versions.
accesskit = "0.24.1"
vello_cpu = "0.3"
parley = "0.12"
# The library Fontique links on Linux; ljos_text asks it for family substitutes.
yeslogic-fontconfig-sys = "6.0.1"
# Must match the skrifa that vello_cpu, parley and epaint use, so the font stack is not duplicated.
skrifa = "0.44"

# Images
zune-jpeg = "0.5.15"
# SVG: parsed by usvg and drawn by resvg (linebender), pure Rust. Without
# text, so it brings no second font stack, and without its own raster decoders.
resvg = { version = "0.48.1", default-features = false, features = ["svgz"] }
# Test fixtures only: nothing shipped encodes JPEG.
jpeg-encoder = "0.7.1"

# Media (ljos_media, section 7.6). FilmCraft's pure-Rust demuxers and
# decoders, a git submodule at third_party/filmcraft (MIT OR Apache-2.0),
# used unmodified; `git submodule update --init --depth 1 third_party/filmcraft`.
filmcraft-codecs = { path = "third_party/filmcraft/crates/codecs" }
filmcraft-media = { path = "third_party/filmcraft/crates/media" }
filmcraft-frame = { path = "third_party/filmcraft/crates/frame" }
filmcraft-time = { path = "third_party/filmcraft/crates/time" }
# Audio output: ALSA (libasound2-dev on Linux), CoreAudio, WASAPI, AAudio.
cpal = "0.18.2"

# Text editing
# Grapheme clusters for cursor movement.
unicode-segmentation = "1.13"
# Validators need a partial match (Intermediate), which a backtracking matcher cannot give.
regex-automata = "0.4.18"
# Look-around and back-references in a validator's pattern, which the DFA
# cannot take; it is built on the same regex-automata and regex-syntax.
fancy-regex = "=0.19.2"

# Localisation
icu_plurals = "2.3"
icu_locale = "2.3"
icu_decimal = "2.3"
icu_calendar = "2.3"
icu_datetime = "2.3"
writeable = "0.6"
quick-xml = "0.42"
# QtQuick.LocalStorage (ljos_localstorage). SQLite itself is compiled in,
# so an application needs no system library and gets the same SQLite
# everywhere.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# Development tools
# File events from the kernel (inotify, FSEvents, ReadDirectoryChangesW): nothing polls.
notify = "8.2"

# Async, services and MCP
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
futures = "0.3"
tokio-util = "0.7.20"
rmcp = { version = "3.5", default-features = false }
schemars = "1.2"
# The inspector's HTTP listener (ljos_mcp_core `http`): loopback, one bearer token.
hyper = { version = "1.12", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http = "1.5"
# HTTP and HTTPS for what an application fetches (ljos_platform `http`).
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# The TLS errors ureq hands back, to say them as Qt does.
rustls = { version = "0.23.46", default-features = false }
# The JS `URL` global: WHATWG parsing and serialisation (ljos_engine).
url = "2.5.8"
http-body-util = "0.1.5"
bytes = "1.12"
getrandom = "0.4"
constant_time_eq = "0.4"

# Proc macros
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.7", features = ["full"] }

# Common
arcstr = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
blake3 = "1.8"
png = "0.18"
# GIF, still and animated (Image shows the first frame, AnimatedImage
# plays them all); the encoder is only for test fixtures.
gif = { version = "0.13.1", default-features = false, features = ["std"] }
toml = "1.1"
regex = "1.13"
globset = "0.4.20"

# Tests
cucumber = "0.23.0"
gherkin = "0.16.0"
proptest = "1.11"
insta = { version = "1.49", features = ["json"] }
tempfile = "3"

# One oxc parser for everything: the vendored fork replaces the registry copy.
[patch.crates-io]
oxc_parser = { path = "vendor/oxc_parser" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
panic = "unwind" # the supervisor recovers from panics (D11)
lto = "thin"
