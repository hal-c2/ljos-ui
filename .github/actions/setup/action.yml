name: setup
description: What every job that builds or runs Ljós needs after its checkout
inputs:
  rust:
    description: "Install the toolchain and restore the build cache; a job that runs binaries built before needs neither"
    default: "true"
  save-cache:
    description: "Save the build cache when the job ends; one job saves it, on main"
    default: "false"
runs:
  using: composite
  steps:
    # FilmCraft (QtMultimedia's decoders) is a submodule the workspace builds from by path;
    # only it is fetched, shallow, not the corpus.
    - if: inputs.rust == 'true'
      shell: bash
      run: git submodule update --init --depth 1 third_party/filmcraft
    # Toolchains the image ships and these jobs never use.
    - if: inputs.rust == 'true'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
    - if: inputs.rust == 'true'
      uses: jdx/mise-action@v3
    # One cache for every job, of the dependencies only: a workspace crate's build is not kept,
    # as a fresh checkout's file times make cargo build it again anyway. Only the job that
    # builds everything saves it, on main, so a pull request never evicts main's.
    - if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci
        save-if: ${{ inputs.save-cache == 'true' }}
    # The egui_kittest render tests need a wgpu adapter; lavapipe is a software Vulkan.
    # Font discovery links fontconfig on Linux (the test fonts themselves are in the repository),
    # and the audio sink links ALSA. The time-zone scenarios name legacy zones (`EST5EDT`), which
    # Ubuntu 26.04 keeps out of tzdata.
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev libasound2-dev pkg-config tzdata-legacy
