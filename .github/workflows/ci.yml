name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The gallery ratchet needs qml6 for its reference pictures, and the tests that hold Ljós's
  # types to Qt's description need an installed Qt, so both run nightly.
  schedule:
    - cron: "17 3 * * *"
  # The nightly jobs, on demand: after a change to them, or to see whether a fix holds.
  workflow_dispatch:
    inputs:
      base:
        description: "Run only what the change since this revision reaches, as a pull request would; empty runs everything"
        default: ""

# Every run of main is kept to its end, so main is never left without a verdict; a pull
# request's newer push replaces its older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The workspace links well over a hundred test binaries, each with the whole toolkit in it,
# which is more than a hosted runner's disk holds with line tables in every one. A panic still
# names its file and line without them.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  # No Qt is installed here. The front end reads QML against Ljós's own description of its
  # types, which is committed (crates/qt_types/src/ljos.txt); the table of Qt's types is
  # generated from an installed Qt and never committed (ARCHITECTURE.md D1), so a checkout has
  # none. `none` says so outright instead of leaving it to the file being absent. What only
  # Qt's table can test runs in the `qt-types` job below.
  LJOS_QT_TYPES: none

jobs:
  # What the change can reach (scripts/ci_changes.py): a pull request runs that, main, the
  # nightly run and a dispatch run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      clippy: ${{ steps.plan.outputs.clippy }}
      clippy_args: ${{ steps.plan.outputs.clippy_args }}
      wasm: ${{ steps.plan.outputs.wasm }}
      tests: ${{ steps.plan.outputs.tests }}
      lint: ${{ steps.plan.outputs.lint }}
      features: ${{ steps.plan.outputs.features }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
    steps:
      # A pull request is checked out as its merge with the base, whose first parent is the base.
      # A dispatch with a base needs the history back to it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.base != '' && 0 || 2 }}
          persist-credentials: false
      # The image's own cargo reads the workspace's shape; no toolchain is installed for it.
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mode=(--mode pr --base HEAD^1)
          elif [ -n "$BASE" ]; then
            mode=(--mode pr --base "$BASE")
          else
            mode=(--mode full)
          fi
          python3 scripts/ci_changes.py "${mode[@]}" | tee -a "$GITHUB_OUTPUT"

  # Links and the scripts CI runs: no build, so every run has them.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 scripts/doc_links.py
      - run: python3 scripts/ci_changes_test.py

  clippy:
    needs: changes
    if: needs.changes.outputs.clippy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: read -ra args <<< "$CLIPPY_ARGS" && mise run check -- "${args[@]}"
        env:
          CLIPPY_ARGS: ${{ needs.changes.outputs.clippy_args }}
      - run: mise run check:wasm
        if: needs.changes.outputs.wasm == 'true'

  test:
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    name: test ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # All of them, so one run shows every failure a runner has; a test that runs past its
      # deadline (.config/nextest.toml) is ended and named.
      - run: read -ra args <<< "$PACKAGES" && cargo nextest run --profile ci --no-tests=pass "${args[@]}"
        env:
          PACKAGES: ${{ matrix.shard.packages }}
      # nextest does not run doctests.
      - run: read -ra args <<< "$DOC" && cargo test --doc "${args[@]}"
        if: ${{ !cancelled() && matrix.shard.doc != '' }}
        env:
          DOC: ${{ matrix.shard.doc }}
      - run: df -h /
        if: always()

  # The features runner and the programs its steps run, built once for the lint and every shard.
  features-build:
    needs: changes
    if: needs.changes.outputs.features != '[]' || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          runner=$(cargo test -p ljos_bdd --test features --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "features" and .executable != null) | .executable')
          cp "$runner" "$RUNNER_TEMP/bin/features"
          cargo build -p ljos_cli -p ljos_fuzz -p ljos_bdd --bin ljos --bin ljos-fuzz --bin features-lint
          cp target/debug/ljos target/debug/ljos-fuzz target/debug/features-lint "$RUNNER_TEMP/bin/"
          ls -la "$RUNNER_TEMP/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: features-bin
          path: ${{ runner.temp }}/bin
          retention-days: 1

  lint:
    needs: [changes, features-build]
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: features-bin
          path: ${{ runner.temp }}/bin
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: chmod +x "$RUNNER_TEMP"/bin/* && "$RUNNER_TEMP/bin/features-lint"

  # Every scenario that is not backlog passes on the Ljós backend, so the ledger gates; a
  # pull request runs the files its change reaches. The Qt oracle (features:parity) runs
  # nightly where Qt is installed (ARCHITECTURE.md 18.6).
  features:
    needs: [changes, features-build]
    if: needs.changes.outputs.features != '[]'
    name: features ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: features-bin
          path: ${{ runner.temp }}/bin
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      # A scenario that runs past its deadline (features/README.md) ends the shard and is named.
      - run: |
          chmod +x "$RUNNER_TEMP"/bin/*
          read -ra files <<< "$FILES"
          bash mise-tasks/features/run --backend ljos "${files[@]}"
        env:
          FILES: ${{ matrix.shard.files }}
          LJOS_BDD_FEATURES_BIN: ${{ runner.temp }}/bin/features
          LJOS_BIN: ${{ runner.temp }}/bin/ljos
          LJOS_FUZZ_BIN: ${{ runner.temp }}/bin/ljos-fuzz

  # External acceptance suites (acceptance/README.md): the in-repo example proves the
  # mechanism; both tasks read a fixture in this repository and need no Qt.
  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run features:acceptance example
      - run: mise run features:acceptance-test

  # Builds what the other jobs build, on main, and saves it as the cache they restore. It
  # gates nothing: on main every other job builds the same things and checks them.
  cache:
    # A dispatch with a `base` is a subset run, like a pull request's.
    if: github.event_name != 'pull_request' && inputs.base == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-run
      - run: cargo test -p ljos_bdd --test features --no-run
      - run: cargo build -p ljos_cli -p ljos_fuzz -p ljos_bdd --bin ljos --bin ljos-fuzz --bin features-lint
      - run: df -h /
        if: always()

  # The one check a branch rule names: it passes when each job the change needed passed, and
  # the jobs it did not need were left out.
  ci-ok:
    if: always()
    needs: [changes, docs, clippy, test, features-build, lint, features, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` decides what is left out, so it must have run; the rest passed or were left out.
          echo "$NEEDS" | jq -e '
            .changes.result == "success"
            and ([.[] | .result] | all(. == "success" or . == "skipped"))' > /dev/null

  qt-types:
    # The gates of `clippy`, `test` and `features`, in a build that reads QML against a table of
    # Qt's types. It is where the tests run that compare Ljós's types with Qt's description of
    # them (they print `SKIPPED` in the `test` shards), and where a type Qt has and Ljós lacks is
    # told from a slip.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.base == '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The table of Qt's types, generated below, is the one read here.
      LJOS_QT_TYPES: ""
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      # FilmCraft (QtMultimedia's decoders) is a submodule the workspace builds from by path;
      # only it is fetched, shallow, not the corpus.
      - run: git submodule update --init --depth 1 third_party/filmcraft
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the cache the other jobs share: every crate is built against another table here.
          key: qt-types
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev libasound2-dev pkg-config tzdata-legacy
      # The table is generated from the qmldir and .qmltypes files of the Qt it is written for.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          # QtMultimedia is an add-on: without it the table has no module for Ljós's own to be
          # compared with.
          modules: qtmultimedia
          cache: true
      - run: mise run types -- --qt "$QT_ROOT_DIR/qml"
      - run: mise run check
      - run: mise run test -- --no-fail-fast
      - run: df -h /
        if: always()
      - run: mise run features

  gallery:
    # Needs the corpus/qtdoc submodule and qml6 (a black box, offscreen). See corpus/README.md.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.base == '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The gallery reads QML against the table of Qt's types it finds, as it always has.
      LJOS_QT_TYPES: ""
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # Already there with every submodule; said so that no building job leaves it out.
      - run: git submodule update --init --depth 1 third_party/filmcraft
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      # Font discovery links fontconfig and the audio sink ALSA, as in the other jobs.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev pkg-config tzdata-legacy
      # The Qt the floors were set against, as in `qt-types`. Ubuntu's own is older and splits
      # Qt Quick into packages: without Particles, XmlListModel, folderlistmodel and the Controls
      # styles half the reference pictures could not be taken.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          modules: qtmultimedia
          cache: true
      # The floors were set where `sans-serif` and `serif` are Liberation; Ubuntu's are DejaVu,
      # which sets every line of text at another width. Both runtimes read this through
      # fontconfig, as the gallery task links the user's fontconfig directory.
      - run: |
          sudo apt-get install -y fonts-liberation
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
            <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
          </fontconfig>
          EOF
          fc-match sans-serif
      # The scripts run `qml6`; Qt's own install names the runner `qml`.
      - run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$QT_ROOT_DIR/bin/qml" "$HOME/.local/bin/qml6"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run gallery:reference
      - run: mise run gallery
      # Differential fuzzing against the same Qt, failing only on a bucket not in
      # crates/ljos_fuzz/known/<area>.txt. The pinned seeds are triaged: every bucket they find
      # is known, so a new one is a regression and fails the job. The run's own seed (printed, so
      # a bucket can be found again) explores, and only reports what it finds for triage.
      - run: |
          failed=0
          for seed in 1792876201 1792873519 1792881048; do
            FUZZ_OUT="$RUNNER_TEMP/fuzz/pinned-$seed" mise run fuzz:qt bindings --cases 2000 --seed "$seed" || failed=1
          done
          # The other areas are smaller, and one triaged seed each holds what they found.
          for area in geometry connections creation models builtins states loaders; do
            FUZZ_OUT="$RUNNER_TEMP/fuzz/pinned-$area" mise run fuzz:qt "$area" --cases 2000 --seed 101 || failed=1
          done
          exit "$failed"
        if: ${{ !cancelled() }}
      - run: mise run fuzz:qt bindings --cases 2000 --seed "$GITHUB_RUN_ID"
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FUZZ_OUT: ${{ runner.temp }}/fuzz/rotating
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fuzz-repros
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore
