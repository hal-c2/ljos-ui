name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
      - run: mise run test
      # Until the engine lands the Ljós backend fails every scenario by design, so CI lints the
      # ledger only. The ratchet gate (features/RATCHET) replaces this once scenarios pass.
      # The Qt oracle (features:parity) runs nightly where Qt is installed (ARCHITECTURE.md 18.6).
      - run: mise run features:lint
