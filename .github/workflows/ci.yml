name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The gallery ratchet needs qml6 for its reference pictures, and the tests that hold Ljós's
  # types to Qt's description need an installed Qt, so both run nightly.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The workspace links well over a hundred test binaries, each with the whole toolkit in it,
    # which is more than a hosted runner's disk holds with line tables in every one. A panic still
    # names its file and line without them.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      # No Qt is installed here. The front end reads QML against Ljós's own description of its
      # types, which is committed (crates/qt_types/src/ljos.txt); the table of Qt's types is
      # generated from an installed Qt and never committed (ARCHITECTURE.md D1), so a checkout has
      # none. `none` says so outright instead of leaving it to the file being absent. What only
      # Qt's table can test runs in the `qt-types` job below.
      LJOS_QT_TYPES: none
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      # Toolchains the image ships and this job never uses.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      # The egui_kittest render tests need a wgpu adapter; lavapipe is a software Vulkan.
      # Font discovery links fontconfig on Linux (the test fonts themselves are in the repository).
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev pkg-config
      - run: mise run check
      # All of them, so one run shows every failure a runner has.
      - run: mise run test -- --no-fail-fast
      - run: df -h /
        if: always()
      - run: mise run features:lint
      # Every scenario that is not backlog passes on the Ljós backend, so the whole ledger gates.
      # The Qt oracle (features:parity) runs nightly where Qt is installed (ARCHITECTURE.md 18.6).
      - run: mise run features
      # External acceptance suites (acceptance/README.md): the in-repo example proves the
      # mechanism; both tasks read a fixture in this repository and need no Qt.
      - run: mise run features:acceptance example
      - run: mise run features:acceptance-test

  qt-types:
    # The same gates as `check`, in a build that reads QML against a table of Qt's types. It is
    # where the tests run that compare Ljós's types with Qt's description of them (they print
    # `SKIPPED` in `check`), and where a type Qt has and Ljós lacks is told from a slip.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the cache of `check`: every crate is built against another table here.
          key: qt-types
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev pkg-config
      # The table is generated from the qmldir and .qmltypes files of the Qt it is written for.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          cache: true
      - run: mise run types -- --qt "$QT_ROOT_DIR/qml"
      - run: mise run check
      - run: mise run test -- --no-fail-fast
      - run: df -h /
        if: always()
      - run: mise run features

  gallery:
    # Needs the corpus/qtdoc submodule and qml6 (a black box, offscreen). See corpus/README.md.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qt6-declarative-dev-tools
      - run: mise run gallery:reference
      - run: mise run gallery
