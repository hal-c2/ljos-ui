[package]
name = "ljos_a11y"
description = "Accessibility for Ljós without a toolkit: Qt's Accessible roles, their AccessKit mapping, and an incremental tree a scene fills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accesskit.workspace = true

[dev-dependencies]
# Live regions are audited as a scene has them, in a light and a dark
# scheme; the crate itself stays free of the scene and the engine.
ljos_compiler = { path = "../ljos_compiler" }
ljos_controls = { path = "../ljos_controls" }
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
ljos_render = { path = "../ljos_render", default-features = false }
ljos_runtime = { path = "../ljos_runtime" }
ljos_test = { path = "../ljos_test" }
qml_front = { path = "../qml_front" }

[lints]
workspace = true
