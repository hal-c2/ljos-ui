[package]
name = "ljos_xml"
description = "The QtQml.XmlListModel module for Ljós: a read-only list model over an XML document, as an opt-in crate written against the ljos facade alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The facade alone (no shell: a module crate opens no windows), and the
# streaming XML reader the rows are read with.
ljos = { path = "../ljos", default-features = false }
quick-xml.workspace = true

[dev-dependencies]
# Tests compile QML strings; the crate itself never links the compiler or
# the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }
# Tests compile against the engine-backed oracle: this crate's types are
# in no type table.
ljos = { path = "../ljos", features = ["dev-qml"] }

[lints]
workspace = true
