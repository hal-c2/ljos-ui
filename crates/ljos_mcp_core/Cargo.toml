[package]
name = "ljos_mcp_core"
description = "MCP surface, capabilities, tool registry and size capping shared by Ljós MCP servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The engine-neutral half of the live inspector (§19.4): the snapshot
# outline, the ref table and locators.
inspect = ["dep:regex"]
# Streamable HTTP on loopback or a 0600 Unix socket, behind a bearer token
# (§19.7). Only the inspector listens; the authoring server is stdio.
http = [
    "rmcp/transport-streamable-http-server",
    "tokio/net",
    "tokio/rt",
    "tokio/signal",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body-util",
    "dep:bytes",
    "dep:getrandom",
    "dep:constant_time_eq",
    "dep:libc",
    "dep:windows-sys",
]
# A client in the same process, for tests and for hosts that drive a
# surface themselves (§19.2: "host the inspector in-process").
client = ["rmcp/client", "tokio/rt"]
# A client of an inspector in another process, through its token file
# (§19.7): what `ljos observe` and `ljos attach` use, and any program that
# drives a running application.
remote = ["http", "hyper/client", "tokio/time", "tokio/sync"]

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
regex = { workspace = true, optional = true }
# Only the `http` feature needs these.
hyper = { workspace = true, features = ["server", "http1"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
constant_time_eq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# Whether a token file's process runs (`process_alive`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "macros", "transport-io", "transport-worker"] }
tempfile.workspace = true

[lints]
workspace = true
