[package]
name = "ljos_positioning"
description = "The QtPositioning module for Ljós: coordinates and shapes on the Earth, and a PositionSource fed by the system's position service, as an opt-in crate written against the ljos facade alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The facade alone: a module crate opens no windows.
ljos = { path = "../ljos", default-features = false }

[dev-dependencies]
# Tests compile QML strings; the crate itself never links the compiler or
# the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }
ljos = { path = "../ljos", features = ["dev-qml"] }

[lints]
workspace = true
