[package]
name = "ljos_web"
description = "What the ljos facade is on wasm32: a native type's struct, its tellings and its paint on a page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Everything is under wasm32, so that a workspace build on the desktop
# compiles no wasm-bindgen and only the target that needs it pays. Without B0:
# the display list and nothing of egui (CLAUDE.md rule 4).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ljos_macros = { path = "../ljos_macros", features = ["web"] }
ljos_render = { path = "../ljos_render", default-features = false }
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
