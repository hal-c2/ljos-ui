[package]
name = "ljos_bdd"
description = "Gherkin runner for the features/ ledger: World, steps and the Backend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[[test]]
name = "features"
harness = false
# Opt-in: `cargo test --workspace` skips it; `mise run features` runs it with
# `--test features`.
test = false

[dependencies]
cucumber = { workspace = true, features = ["output-junit"] }
gherkin.workspace = true
clap.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
# External acceptance suites: reading PIN, features.globs and RATCHET, and
# judging a run (src/acceptance/).
ljos_ratchet = { path = "../ljos_ratchet" }
# Image files for scenarios are made by code (src/fixture.rs).
png.workspace = true
jpeg-encoder.workspace = true
gif.workspace = true
# The Ljós backend. This is a test tool, so it may link the compiler (and so
# the parser); shipped runtimes never do (ARCHITECTURE.md principle 5).
ljos_a11y = { path = "../ljos_a11y" }
# Every process a backend or the author starts ends with it.
ljos_child = { path = "../ljos_child" }
# The @desktop surface: the sandbox compositor's virtual pointer and its
# windows (src/backend/desktop.rs).
ljos_bench = { path = "../ljos_bench" }
# The author's desktop: a session bus and settings portal of the
# scenario's own (src/author/desktop.rs).
zbus.workspace = true
# The design audit of the `design audit` steps.
ljos_audit = { path = "../ljos_audit" }
ljos_compiler = { path = "../ljos_compiler" }
ljos_controls = { path = "../ljos_controls" }
# The files of Ljos.Design, as `ljos design export` writes them.
ljos_design = { path = "../ljos_design" }
ljos_drive = { path = "../ljos_drive" }
# Hot reload scenarios run the dev loop's own pipeline (in memory, on the
# virtual clock).
ljos_dev = { path = "../ljos_dev", features = ["mcp"] }
# Inspector scenarios (features/tooling/mcp) ask the development build's
# own inspector, through an in-process MCP client and over loopback HTTP.
ljos_mcp_core = { path = "../ljos_mcp_core", features = ["client", "inspect", "http"] }
# The directory of a served inspector's token file.
tempfile.workspace = true
ljos_engine = { path = "../ljos_engine" }
# The engine-backed type oracle so app-registered types (ljos_xml) type-check.
ljos = { path = "../ljos", default-features = false, features = ["dev-qml"] }
# `.ts` catalogues of scenarios, read as a development build reads them.
ljos_i18n = { path = "../ljos_i18n" }
ljos_quick = { path = "../ljos_quick", features = ["pdf"] }
# Opt-in modules scenarios may import (QtQml.XmlListModel,
# Qt.labs.folderlistmodel, Qt.labs.lottieqt, QtPositioning, QtMultimedia).
ljos_xml = { path = "../ljos_xml" }
ljos_lottie = { path = "../ljos_lottie" }
ljos_folderlistmodel = { path = "../ljos_folderlistmodel" }
ljos_positioning = { path = "../ljos_positioning" }
ljos_media = { path = "../ljos_media" }
# QtQuick.LocalStorage keeps its databases in the scenario's home.
ljos_localstorage = { path = "../ljos_localstorage" }
# The system a scenario runs on: its files and its dialogs, answered by
# the scenario, and a network that reaches the scenario's web server.
ljos_platform = { path = "../ljos_platform", features = ["http"] }
ljos_runtime = { path = "../ljos_runtime" }
# The characters of HTML another application copies, which it copies too.
ljos_text = { path = "../ljos_text" }
qml_front = { path = "../qml_front" }
# Which table of types the build reads QML against: a `@no-qt-table` scenario
# is for a build without Qt's.
qt_types = { path = "../qt_types" }
# Only the R (vello_cpu) backend: egui stays out of this crate.
ljos_render = { path = "../ljos_render", default-features = false }

[lints]
workspace = true
