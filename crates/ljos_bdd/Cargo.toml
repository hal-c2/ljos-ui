[package]
name = "ljos_bdd"
description = "Gherkin runner for the features/ ledger: World, steps and the Backend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[[test]]
name = "features"
harness = false
# Opt-in: `cargo test --workspace` skips it; `mise run features` runs it with
# `--test features`. The ljos backend fails as PENDING until the engine exists.
test = false

[dependencies]
cucumber = { workspace = true, features = ["output-junit"] }
gherkin.workspace = true
clap.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
