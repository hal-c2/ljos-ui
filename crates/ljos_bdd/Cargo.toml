[package]
name = "ljos_bdd"
description = "Gherkin runner for the features/ ledger: World, steps and the Backend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[[test]]
name = "features"
harness = false
# Opt-in: `cargo test --workspace` skips it; `mise run features` runs it with
# `--test features`.
test = false

[dependencies]
cucumber = { workspace = true, features = ["output-junit"] }
gherkin.workspace = true
clap.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
# The Ljós backend. This is a test tool, so it may link the compiler (and so
# the parser); shipped runtimes never do (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
ljos_runtime = { path = "../ljos_runtime" }
qml_front = { path = "../qml_front" }
# Only the R (vello_cpu) backend: egui stays out of this crate.
ljos_render = { path = "../ljos_render", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
