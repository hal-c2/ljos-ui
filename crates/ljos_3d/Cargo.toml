[package]
name = "ljos_3d"
description = "Ljós's 3D scene and its wgpu renderer (QtQuick3D): a retained scene of nodes, meshes, materials, lights and cameras, drawn into a texture on a device the host owns, natively or into a canvas on the web; no egui, no engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# The renderer. Without it the crate is the scene alone, which the QML
# types build without linking wgpu (ARCHITECTURE.md §7.8).
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:tracing", "dep:objc2-quartz-core", "dep:objc2-core-graphics"]
# glTF and Wavefront OBJ files read into a scene's nodes, meshes and
# materials, and their images decoded to plain pixels (`gltf`, `obj`). No
# GPU state: binding textures is the renderer's business.
gltf = ["dep:gltf", "dep:png", "dep:zune-jpeg"]
# CustomMaterial's and Effect's GLSL snippets translated into the
# renderer's WGSL (`snippet`), with the naga wgpu already links.
snippets = ["dep:naga"]

[dependencies]
slotmap.workspace = true
thiserror.workspace = true
bytemuck = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
gltf = { workspace = true, optional = true }
png = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
naga = { workspace = true, optional = true, features = ["wgsl-out"] }

# Native: the backends egui-wgpu's default build has, so the two agree on
# one device. The web: WebGPU, and WebGL2 where a browser has no WebGPU.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true, features = ["parking_lot", "vulkan", "metal", "dx12", "gles"] }
# Only for `offscreen`, whose device is its own and asked for in a blocking call.
pollster = { version = "1.0.1", optional = true }
# A Metal layer is told its pictures are sRGB, which wgpu leaves untold
# (#192).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { workspace = true, optional = true }
objc2-core-graphics = { workspace = true, optional = true }
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
png.workspace = true
# To check the shaders translate to WebGL2's GLSL ES 3.00 without a browser.
naga = { workspace = true, features = ["wgsl-out"] }

[lints]
workspace = true

# What draws needs the renderer: without `gpu` these are not built, so
# `--no-default-features` tests the scene alone.
[[example]]
name = "gltf_load"
required-features = ["gltf"]

[[example]]
name = "lit_cube"
required-features = ["gpu"]

[[example]]
name = "many_models"
required-features = ["gpu"]

