[package]
name = "ljos_3d"
description = "Ljós's 3D scene and its wgpu renderer (QtQuick3D): a retained scene of nodes, meshes, materials, lights and cameras, drawn into a texture on a device the host owns, natively or into a canvas on the web; no egui, no engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# The renderer. Without it the crate is the scene alone, which the QML
# types build without linking wgpu (ARCHITECTURE.md §7.8).
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
slotmap.workspace = true
thiserror.workspace = true
bytemuck = { workspace = true, optional = true }

# Native: the backends egui-wgpu's default build has, so the two agree on
# one device. The web: WebGPU, and WebGL2 where a browser has no WebGPU.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true, features = ["parking_lot", "vulkan", "metal", "dx12", "gles"] }
# Only for `offscreen`, whose device is its own and asked for in a blocking call.
pollster = { version = "1.0.1", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
png.workspace = true

[lints]
workspace = true
