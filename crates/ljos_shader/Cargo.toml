[package]
name = "ljos_shader"
description = "ShaderEffect programs: GLSL 440 to GLSL ES 300 and GL 330, std140 reflection, .ljsh artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Compiling GLSL source. Without it only `.ljsh` artifacts (and the
# built-in default shaders) load, and naga is not linked.
compile = ["dep:naga"]

[dependencies]
naga = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ljos_shader = { path = ".", features = ["compile"] }

[lints]
workspace = true
