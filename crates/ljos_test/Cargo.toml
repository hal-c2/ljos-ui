[package]
name = "ljos_test"
description = "Test support for Ljós: the QtTest module (TestCase runner) and the accessibility audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ljos_a11y = { path = "../ljos_a11y" }
# The design audit a test runs on its scene, as `ljos_test::a11y`.
ljos_audit = { path = "../ljos_audit" }
# Settles, lets time pass and draws as every other driver does; what a
# test fetched has come by the time its virtual time passes.
ljos_drive = { path = "../ljos_drive" }
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
# Frames and pictures a test reads. No egui.
ljos_render = { path = "../ljos_render", default-features = false }
ljos_runtime = { path = "../ljos_runtime" }
# The QtTest runner's machine-readable report.
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests compile QML strings; the crate itself never links the compiler or
# the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }
# The audit is run over the Basic style.
ljos_controls = { path = "../ljos_controls" }

[lints]
workspace = true
