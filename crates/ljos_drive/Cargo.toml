[package]
name = "ljos_drive"
description = "The scene driver: a QuickScene settled, given time, found in, handed input, read through accessibility and drawn, as a host drives it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ljos_a11y = { path = "../ljos_a11y" }
ljos_engine = { path = "../ljos_engine" }
# What was fetched or read off the Engine thread has come by the time
# virtual time passes.
ljos_platform = { path = "../ljos_platform" }
ljos_quick = { path = "../ljos_quick" }
# A grab is drawn by the CPU reference renderer. No egui.
ljos_render = { path = "../ljos_render", default-features = false }
ljos_runtime = { path = "../ljos_runtime" }
thiserror.workspace = true

[dev-dependencies]
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }

[lints]
workspace = true
