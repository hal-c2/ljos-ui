[package]
name = "ljos_text"
description = "TextEngine for Ljós: Parley shaping and line breaking, a layout cache, elide, and glyph runs for the render backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ljos_render = { path = "../ljos_render", default-features = false }
parley.workspace = true
# Markdown front end of `RichDoc` (ARCHITECTURE §7.5). Only the parser: the
# HTML renderer is never linked, raw HTML in a document is shown as text.
pulldown-cmark = { version = "0.13.4", default-features = false }
rustc-hash.workspace = true
thiserror.workspace = true
# Grapheme clusters for cursor movement.
unicode-segmentation.workspace = true

# The family fontconfig substitutes for one that is not installed: Fontique
# links the same library and substitutes generic families only.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
yeslogic-fontconfig-sys.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
