[package]
name = "ljos_quick"
description = "QtQuick items for Ljós: Item, Rectangle, Text, anchors, positioners, pointer input and the scene that syncs them to the render tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["shader-compile"]
# A ShaderEffect's GLSL source is compiled when it is shown (with naga).
# Without it only the `.ljsh` files `ljos shaders` makes are read, which is
# what a shipped application wants.
shader-compile = ["ljos_shader/compile"]
# An Image shows the pages of a PDF document, drawn by hayro, which brings
# a rasteriser and font readers of its own. Off, a PDF source is an
# unsupported format, as in a Qt without its PDF plugin.
pdf = ["dep:hayro"]

[dependencies]
ljos_a11y = { path = "../ljos_a11y" }
ljos_engine = { path = "../ljos_engine" }
# The clipboard, remote fonts and the modules of the platform (QtCore,
# QtQuick.Dialogs).
ljos_platform = { path = "../ljos_platform" }
ljos_reactive = { path = "../ljos_reactive" }
ljos_render = { path = "../ljos_render", default-features = false }
ljos_runtime = { path = "../ljos_runtime" }
ljos_shader = { path = "../ljos_shader" }
ljos_text = { path = "../ljos_text" }
bitflags.workspace = true
# Image decoding: PNG and JPEG are the formats Image reads.
png.workspace = true
gif.workspace = true
# ObjectId is a slotmap key; an accessibility node is named by its number.
slotmap.workspace = true
# The scene's maps of items, looked up many times a frame: no SipHash.
rustc-hash.workspace = true
# RegularExpressionValidator: a DFA says whether a text can still become a
# match (Intermediate), which a backtracking matcher cannot.
regex-automata.workspace = true
# Decides acceptance of a pattern with look-around or back-references.
fancy-regex.workspace = true
smallvec.workspace = true
thiserror.workspace = true
zune-jpeg.workspace = true
jpeg-decoder.workspace = true
resvg.workspace = true
# PDF documents in an Image (`pdf`).
hayro = { workspace = true, optional = true }

[dev-dependencies]
# Tests compile QML strings; the crate itself never links the parser.
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }
# Image tests make their JPEG fixtures in code.
jpeg-encoder.workspace = true
# Network pictures are fetched from a listener the test runs on loopback.
ljos_platform = { path = "../ljos_platform", features = ["http"] }

[lints]
workspace = true
