[package]
name = "ljos_cli"
description = "The ljos command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ljos"
path = "src/main.rs"

[dependencies]
ljos_mcp_core = { path = "../ljos_mcp_core" }
ljos_mcp_author = { path = "../ljos_mcp_author" }
# `ljos i18n extract`: the compiler finds the texts, ljos_i18n writes `.ts`.
ljos_compiler = { path = "../ljos_compiler" }
ljos_i18n = { path = "../ljos_i18n" }
# `ljos run`: the desktop shell, with the dev loop (the watcher and the
# reload driver) and, for `--mcp`, the read-only inspector. A development
# tool may link them; a shipped application takes the shell without `dev`
# and without `mcp`.
ljos_engine = { path = "../ljos_engine" }
ljos_shell = { path = "../ljos_shell", features = ["dev", "mcp"] }
# `ljos render`: a picture of a project without a window, on the R backend.
ljos_controls = { path = "../ljos_controls" }
ljos_quick = { path = "../ljos_quick" }
ljos_render = { path = "../ljos_render", default-features = false }
ljos_runtime = { path = "../ljos_runtime" }
# `ljos test`: the QtTest runner, the IR it is given, and the type oracle
# that tells the compiler what `TestCase` is.
ljos_test = { path = "../ljos_test" }
ljos_ir = { path = "../ljos_ir" }
qml_front = { path = "../qml_front" }
# `ljos fmt`: the layout the authoring server's `qml_format` gives too.
qml_fmt = { path = "../qml_fmt" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `tests/own_types.rs` asks which table of types the build has.
qt_types = { path = "../qt_types" }

[lints]
workspace = true
