[package]
name = "ljos_runtime"
description = "Ljós runtime core: bounded UI inbox, clocks, frame scheduler, lanes and supervision types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Supervised tokio tasks (`supervisor::tasks`). Off by default: the engine and
# the UI crates need the tree only, not an async runtime.
tasks = ["dep:tokio", "dep:tokio-util"]

[dependencies]
bitflags.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
# `CancellationToken`.
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
# Turns `tasks` on for this crate's own tests.
ljos_runtime = { path = ".", features = ["tasks"] }

[lints]
workspace = true
