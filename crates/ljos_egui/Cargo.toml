[package]
name = "ljos_egui"
description = "QmlView: an egui widget that hosts a Ljós QuickScene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ljos_a11y = { path = "../ljos_a11y" }
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
ljos_render = { path = "../ljos_render", features = ["b0"] }
ljos_runtime = { path = "../ljos_runtime" }
ljos_text = { path = "../ljos_text" }
egui.workspace = true
thiserror.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
# tests/graft.rs reads the trees the way the platform adapters of this egui
# do: the version accesskit_unix builds on, which is not the one kittest
# wraps.
accesskit_consumer = "0.39.1"
png.workspace = true
# tests/scripts.rs compiles a QML string; the crate never links the parser.
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }

[lints]
workspace = true
