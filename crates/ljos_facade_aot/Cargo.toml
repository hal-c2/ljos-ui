[package]
name = "ljos_facade_aot"
description = "An application whose QML imports its own native module and is compiled ahead of time by its build script, as docs/MIGRATION.md section 6 describes: the build script reads the type dump file the application's test writes, and the program embeds the pack and links no parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The program and its native module: the facade with no parser.
[dependencies]
ljos = { path = "../ljos", default-features = false }

# The build script: the facade's `build` feature alone. It reads the
# native types from `ljostypes.json`, so they stay in this crate.
[build-dependencies]
ljos = { path = "../ljos", default-features = false, features = ["build"] }

[lints]
workspace = true
