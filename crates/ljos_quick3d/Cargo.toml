[package]
name = "ljos_quick3d"
description = "The QtQuick3D module for Ljós: View3D shows a scene of Nodes, Models, cameras and lights, drawn by ljos_3d, as an opt-in crate written against the ljos facade alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

build = "build.rs"

[features]
default = ["gltf"]
# RuntimeLoader reads glTF files. Without it the type is still there and
# every source is an error that says so.
gltf = ["ljos/gltf"]

[dependencies]
# The facade alone: a module crate opens no windows. Its `quick3d`
# feature has the painters draw the View3D draw op this crate paints.
ljos = { path = "../ljos", default-features = false, features = ["quick3d"] }
# The module's QML, packed as IR by build.rs.
ljos_ir = { path = "../ljos_ir" }
# A view's key for its painter is its object id, as a number.
slotmap = { workspace = true }
# FileInstancing's XML tables, read with the reader ljos_xml uses.
quick-xml.workspace = true
# ExtrudedTextGeometry: the glyph outlines of the text stack's fonts, and
# their fill as triangles. Both are already linked through ljos_render.
skrifa.workspace = true
lyon_tessellation.workspace = true

[build-dependencies]
# The module's QML is compiled when this crate is built; the crate never
# links the compiler or the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
ljos_ir = { path = "../ljos_ir" }
qt_types = { path = "../qt_types" }

[dev-dependencies]
# Tests compile QML strings; the crate itself never links the compiler or
# the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
ljos = { path = "../ljos", default-features = false, features = ["dev-qml", "quick3d", "render"] }
png = { workspace = true }
# A renderer kept across frames, to see what it keeps of views that went.
ljos_render = { path = "../ljos_render", features = ["offscreen3d"] }

[lints]
workspace = true
