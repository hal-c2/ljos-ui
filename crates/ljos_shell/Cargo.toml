[package]
name = "ljos_shell"
description = "Desktop shell for Ljós: its own loop on ljos_host with egui-winit, egui's GL painter on EGL (egui-wgpu where there is none), one Engine, a platform window for every QML Window, and the UI inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ljos_a11y = { path = "../ljos_a11y" }
ljos_controls = { path = "../ljos_controls" }
ljos_egui = { path = "../ljos_egui" }
# B0's shader callbacks, which the GL painter runs (src/gl_shader.rs).
ljos_render = { path = "../ljos_render", features = ["b0"] }
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
ljos_runtime = { path = "../ljos_runtime" }
ljos_host = { path = "../ljos_host" }
# Only with `media` (on by default): QtMultimedia, registered beside the
# standard modules.
ljos_media = { path = "../ljos_media", optional = true, default-features = false, features = ["decode"] }
# The desktop's own clipboard, dialogs and HTTP fetcher, which only the
# shell's loop installs; the other hosts keep the in-process ones.
ljos_platform = { path = "../ljos_platform", features = ["native", "http"] }
egui.workspace = true
# The loop is the shell's own (ARCHITECTURE.md §7.3): winit through
# ljos_host, egui's input translation and its painters. Not in the
# workspace pins; the versions are egui's. wgpu draws where there is no
# EGL, or where GL cannot be had (LJOS_PAINTER=wgpu asks for it).
egui-winit = { version = "0.36.2", features = ["accesskit"] }
egui-wgpu = { version = "0.36.2", features = ["winit", "wayland", "x11"] }
# Surface creation is asynchronous in wgpu and immediate on the desktop.
pollster = "1.0.1"
thiserror.workspace = true
# Only with `eframe`: for a host that has an eframe application of its own
# and shows a `ShellApp` in it.
eframe = { workspace = true, optional = true }
# Only with `dev`: the watcher and the reload driver, which link the
# compiler and so the parser. A shipped application leaves the feature off
# (CLAUDE.md rule 5; tests/no_parser.rs keeps it so).
ljos_dev = { path = "../ljos_dev", optional = true }

# glibc's allocator is told to map large buffers from the system (`run`).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc.workspace = true

# The application's badge: the launcher-entry signal on the session bus;
# the desktop's settings portal.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
# Not used directly: holds zbus's thread pool at a version whose idle
# threads end (see the workspace's Cargo.toml).
blocking.workspace = true

# The application's badge: the Dock tile. The workspace's accessibility
# display options and their change notification.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSAccessibility"] }
objc2-foundation = { workspace = true, features = ["NSNotification", "NSOperation", "block2"] }
block2.workspace = true

# What the system prefers: system parameters, the Accessibility key, and a
# hidden window that hears WM_SETTINGCHANGE.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

# GL on EGL (src/gl.rs; build.rs says where): wgpu's GL present copies
# every frame once more, which on a software rasteriser is most of what a
# frame costs.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
egui_glow.workspace = true
glow.workspace = true
glutin.workspace = true

[features]
default = ["media", "media-audio"]
# QtMultimedia: video through the render tree, sound to a null sink
# unless `media-audio` is on too.
media = ["dep:ljos_media"]
# Sound through the system's output device (cpal).
media-audio = ["media", "ljos_media/audio"]
# `impl eframe::App for ShellApp`. `run` does not need it: the shell has
# its own loop (tests/no_eframe.rs keeps eframe out of it).
eframe = ["dep:eframe"]
# Dev hot reload: `Setup::watch` compiles a directory of QML, watches it
# and applies every save to the running application.
dev = ["dep:ljos_dev"]
# The read-only MCP inspector an agent connects to (ARCHITECTURE.md §19.4):
# `Setup::serve_inspector`. Off by default: without it the shell links no
# MCP SDK and no HTTP server (tests/no_mcp.rs keeps it so).
mcp = ["dev", "ljos_dev/mcp"]

[dev-dependencies]
# The tests drive a `ShellApp` in kittest's eframe harness.
ljos_shell = { path = ".", features = ["eframe"] }
# The demo_qml example starts through the facade's App builder, as an
# application does (a dev-only cycle: the facade's shell is this crate).
# tests/dev.rs watches files against the types a program registers, which
# `dev-qml`'s EngineOracle knows.
ljos = { path = "../ljos", features = ["dev-qml"] }
# Only the demo_qml example compiles QML; the shell itself never links the
# compiler.
ljos_compiler = { path = "../ljos_compiler" }
# examples/frame_profile.rs: a project that keeps scores in a database.
ljos_localstorage = { path = "../ljos_localstorage" }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
anyhow.workspace = true
png.workspace = true
# tests/dev.rs edits a project on disk under the watcher.
tempfile.workspace = true
# tests/tools.rs reads the inspector's answers.
serde_json.workspace = true
# examples/reload_profile.rs tells the steps of a reload under LJOS_LOG.
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "reload_profile"
required-features = ["dev"]
