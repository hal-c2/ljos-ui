[package]
name = "ljos_studio"
description = "The QML modules Design Studio's output imports (QtQuick.Studio.Components, QtQuick.Studio.DesignEffects) built in, as far as Ljós draws them, compiled to IR when the crate is built"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ljos_engine = { path = "../ljos_engine" }
ljos_ir = { path = "../ljos_ir" }

[build-dependencies]
# The modules' QML is compiled when this crate is built; the crate never
# links the compiler or the parser (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler" }
ljos_ir = { path = "../ljos_ir" }
qt_types = { path = "../qt_types" }

[lints]
workspace = true
