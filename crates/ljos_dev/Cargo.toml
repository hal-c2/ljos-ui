[package]
name = "ljos_dev"
description = "Dev tools for Ljós: hot reload, the error overlay's model, the `top` overlay's model and the MCP inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The MCP inspector (ARCHITECTURE.md §19.4). Off by default: a
# build without it links no MCP SDK and no HTTP server.
mcp = [
    "dep:ljos_mcp_core",
    "dep:ljos_a11y",
    "dep:ljos_drive",
    "dep:ljos_audit",
    "dep:ljos_render",
    "dep:ljos_platform",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:schemars",
    "dep:slotmap",
    "dep:libc",
    "dep:procfs",
    "dep:libproc",
    "dep:mach2",
    "dep:windows-sys",
]

[dependencies]
# A dev tool: it compiles QML, so it links the parser. A shipped program
# never depends on this crate (ARCHITECTURE.md principle 5); ljos_shell
# takes it only behind its `dev` feature.
ljos_compiler = { path = "../ljos_compiler" }
ljos_engine = { path = "../ljos_engine" }
ljos_ir = { path = "../ljos_ir" }
ljos_quick = { path = "../ljos_quick" }
ljos_runtime = { path = "../ljos_runtime" }
qml_front = { path = "../qml_front" }
blake3.workspace = true
thiserror.workspace = true
notify.workspace = true
ljos_mcp_core = { path = "../ljos_mcp_core", features = ["inspect", "http"], optional = true }
# The outline is the accessibility tree; a picture is drawn by the R backend.
ljos_a11y = { path = "../ljos_a11y", optional = true }
ljos_render = { path = "../ljos_render", default-features = false, optional = true }
# Acts settle, aim, type and let time pass the way every other driver does.
ljos_drive = { path = "../ljos_drive", optional = true }
# `app_audit`: the design audit, on the scene the inspector looks at.
ljos_audit = { path = "../ljos_audit", optional = true }
# Requests out to platform threads, for `app_processes`.
ljos_platform = { path = "../ljos_platform", optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
# A handle names an object by its generational key.
slotmap = { workspace = true, optional = true }

# glibc's allocator says what it holds in use and free, which splits what
# `memory` cannot put to an owner.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = { workspace = true, optional = true }

# The process's threads, memory and CPU time (`process.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }
libproc = { workspace = true, optional = true }
mach2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The end-to-end test makes a scene of the right size.
ljos_render = { path = "../ljos_render", default-features = false }
tempfile.workspace = true
# The inspector's tests drive it as a client in the same process.
ljos_mcp_core = { path = "../ljos_mcp_core", features = ["inspect", "http", "client"] }
serde_json.workspace = true
png.workspace = true
# The holders' timers are tested on a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "inspector"
required-features = ["mcp"]

[[test]]
name = "inspector_http"
required-features = ["mcp"]

[[test]]
name = "observe_alloc"
required-features = ["mcp"]

[[test]]
name = "conformance"
required-features = ["mcp"]

[lints]
workspace = true
