[package]
name = "ljos_render"
description = "RenderTree, DisplayList, compose, hit testing and the R (vello_cpu) and B0 (epaint) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["b0"]
# B0 is the only place in this crate that names egui (ARCHITECTURE.md section 4).
b0 = ["dep:egui", "dep:lyon_tessellation"]
# R drawing a window may spread its work over threads; the reference
# pictures never do, whatever this says.
threads = ["vello_cpu/multithreading"]
# A 3D view drawn where no painter draws it (R, B0 for a painter without
# 3D) is a picture `ljos_3d` draws off-screen and reads back. The crate
# itself names no wgpu: `ljos_3d` does.
offscreen3d = ["ljos_3d/gpu"]
# glTF files read into a 3D scene (QtQuick3D's RuntimeLoader).
gltf = ["ljos_3d/gltf"]

[dependencies]
# MemoryPressure is defined once, beside Evictable.
ljos_runtime = { path = "../ljos_runtime" }
# A View3D's scene, as data; the renderer only with `offscreen3d`.
ljos_3d = { path = "../ljos_3d", default-features = false }
# A ShaderEffect's programs, without naga.
ljos_shader = { path = "../ljos_shader" }
bitflags.workspace = true
png.workspace = true
# Maps keyed by ids looked up many times a frame: no SipHash.
rustc-hash.workspace = true
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
vello_cpu.workspace = true
skrifa.workspace = true
egui = { workspace = true, optional = true }
# B0 turns paths into triangles with it (ARCHITECTURE.md section 7.1). Not in
# the workspace pins: only this backend uses it.
lyon_tessellation = { version = "1.0.22", optional = true }

[lints]
workspace = true
