[package]
name = "ljos"
description = "Ljós UI: a QML runtime in Rust. The facade an application is written against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The facade names no engine internal: it re-exports the curated surface
# an application writes native types against, and registers the standard
# modules (QtQml, QtQuick, QtQuick.Controls) on an Engine it makes.
ljos_engine = { path = "../ljos_engine" }
ljos_quick = { path = "../ljos_quick" }
ljos_controls = { path = "../ljos_controls" }
ljos_platform = { path = "../ljos_platform" }
# Only with `media` (on by default): QtMultimedia. Its sound output is
# `media-audio`'s.
ljos_media = { path = "../ljos_media", optional = true, default-features = false, features = ["decode"] }
# Only with `shell`: the desktop loop an application runs in. Without it
# the facade is the runtime alone (headless hosts, tests, other shells).
ljos_shell = { path = "../ljos_shell", optional = true, default-features = false }
# Only with `mcp`: the inspector's capabilities (`ljos::mcp::Cap`).
ljos_dev = { path = "../ljos_dev", optional = true }
thiserror.workspace = true
# Unconditional: the compute pool behind `task::spawn`, and with `shell`
# the UiHandle type the shell's setup hands out, named here so an
# application needs no second Ljós dependency to hold one. Default
# features only: its tokio `tasks` feature stays off.
ljos_runtime = { path = "../ljos_runtime" }
# The display list a native item paints into (`ljos::item`), and with
# `render` the CPU reference renderer behind `ljos::render`. Without B0,
# so the facade names no egui. `ljos_quick` links both already.
ljos_render = { path = "../ljos_render", default-features = false }
# The text engine a native item lays its text out with (`ljos::item`).
ljos_text = { path = "../ljos_text" }
# Locale data for `ljos::locale`; the engine links it already. Without
# `.ts`, which only development reads.
ljos_i18n = { path = "../ljos_i18n", default-features = false }
# Only with `testing`: the system's preferences a test plays.
ljos_a11y = { path = "../ljos_a11y", optional = true }
# Only with `render` or `testing`: what settles a scene, lets time pass
# on a test clock, hands it input and draws it.
ljos_drive = { path = "../ljos_drive", optional = true }
# Only with `dev-qml` or `build`: compiles QML directories at start-up or
# in a build script, which links the parser. A shipped application's own
# `ljos` leaves both off and embeds compiled IR
# (ARCHITECTURE.md principle 5).
ljos_compiler = { path = "../ljos_compiler", optional = true }
# Only with `dev-qml` or `build`, for `EngineOracle`: the compiler's oracle
# interface the engine-backed oracle implements.
qml_front = { path = "../qml_front", optional = true }
# Only with `dev-qml`, for the component source `qml_dirs` hands the
# engine (`texts.rs`): the compiled files and bytecode it passes on.
ljos_ir = { path = "../ljos_ir", optional = true }
# Only with `build`: the bindings and handlers compiled to Rust
# (`build::compile_dirs_to_rust`).
ljos_aot = { path = "../ljos_aot", optional = true }
ljos_js = { path = "../ljos_js", optional = true }

[dev-dependencies]
# Tests compile QML strings and, for `dev::compile_dir`, a directory.
ljos_compiler = { path = "../ljos_compiler" }
qml_front = { path = "../qml_front" }
# Whether the build reads QML against Qt's table (`extends_item.rs`).
qt_types = { path = "../qt_types" }
tempfile.workspace = true
# Whether a block registry reads a native block's slots from the dump.
ljos_blocks = { path = "../ljos_blocks" }
# An application that hands QML JSON (`records.rs`).
serde_json.workspace = true
# A player reading a stream from a server of the test's own (`media_stream.rs`).
ljos_platform = { path = "../ljos_platform", features = ["http"] }
# So the tests see the facade as an application with dev-qml does.
ljos = { path = ".", features = ["dev-qml", "build", "render", "testing"] }

# The `native_window` example asks the X server about the windows it is
# handed.
[target.'cfg(all(unix, not(any(target_vendor = "apple", target_os = "android", target_os = "emscripten", target_os = "redox"))))'.dev-dependencies]
x11rb.workspace = true

[features]
default = ["shell", "media", "media-audio", "collation"]
shell = ["dep:ljos_shell"]
# `localeCompare` and `ljos::locale::Collator` order text by the locale's
# alphabet (ICU's collation data, about 1.2 MB of a stripped release
# binary). Without it they order every locale's text as the `C` locale
# does, by UTF-16 code units.
collation = ["ljos_i18n/collation"]
# QtMultimedia (MediaPlayer, Video, SoundEffect and their kin), in the
# Engine `engine()` makes and, with `shell`, in the shell's.
media = ["dep:ljos_media", "ljos_shell?/media"]
# Sound through the system's output device (cpal; ALSA's libasound on
# Linux). On by default, and not implied by `media`, so that a program that
# only decodes or shows video can leave the sound library out
# (`default-features = false, features = ["media"]`). Without it sound
# goes to a null sink.
media-audio = ["media", "ljos_media/audio", "ljos_shell?/media-audio"]
# Development only: `ljos::dev::compile_dir` and `App::qml_dir` compile a
# directory of QML at start-up. Never in a shipped application.
dev-qml = ["dep:ljos_compiler", "dep:qml_front", "dep:ljos_ir", "dep:ljos_js"]
# For an application's build script (`[build-dependencies]`):
# `ljos::build::compile_dir_with_types` compiles its QML ahead of time,
# against its own native types as its type dump file describes them
# (`ljos::types`), into a pack the program embeds with
# `ljos::include_qml!`. The program's own `ljos` leaves it off.
build = ["dep:ljos_compiler", "dep:qml_front", "dep:ljos_aot"]
# PDF documents in an Image, a page at a time (hayro, with a rasteriser
# and font readers of its own). Off by default: without it a PDF source is
# an unsupported format, as in a Qt without its PDF plugin.
pdf = ["ljos_quick/pdf"]
# QtQuick3D's View3D drawn: by the desktop painter on its own device (GL's
# context or egui-wgpu's), and everywhere else (headless pictures, the CPU
# painter) as a picture read back from an off-screen device. `ljos_quick3d` turns it on;
# without it a View3D's draw op is skipped.
quick3d = ["ljos_shell?/quick3d", "ljos_render/offscreen3d"]
# glTF files read into a 3D scene (`item::ljos_3d::gltf`), for QtQuick3D's
# RuntimeLoader. `ljos_quick3d` turns it on unless told not to.
gltf = ["ljos_render/gltf"]
# Headless pictures (`ljos::render`): an application's UI drawn to a PNG
# on a virtual clock, for screenshot tests and documentation.
render = ["dep:ljos_drive"]
# Development only: hot reload. `Setup::watch` and its kin compile the
# application's QML, watch it and apply every save to the running
# application (`ljos::reload`). Links the QML compiler; no inspector, MCP
# SDK or HTTP server. A shipped application leaves it off.
dev = ["shell", "ljos_shell/dev", "dep:ljos_dev"]
# Development only: the MCP inspector an agent connects to
# (ARCHITECTURE.md §19.4), served by `App::run` when `App::inspector`
# or the `LJOS_MCP` environment variable asks for it (`ljos::mcp`).
# Links the QML compiler, an MCP SDK and an HTTP server; a shipped
# application leaves it off.
mcp = ["dev", "ljos_shell/mcp", "ljos_dev/mcp"]
# For an application's tests (`[dev-dependencies]`): `ljos::testing`, a
# window without a platform on a virtual clock that a test hands input
# to, and the host's and the system's part a test plays.
testing = ["dep:ljos_a11y", "dep:ljos_drive"]

[lints]
workspace = true
