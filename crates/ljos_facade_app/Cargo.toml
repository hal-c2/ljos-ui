[package]
name = "ljos_facade_app"
description = "An application crate as docs/MIGRATION.md section 6 describes one: native types, a singleton and a module written against the ljos facade alone. Its build is the test that the facade suffices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The facade and nothing else, in tests too: what the
# derive and the attribute macros generate must resolve through it, as
# it does for an application outside this repository.
[dependencies]
ljos = { path = "../ljos", default-features = false }

# `testing`: the facade's window without a platform, for the tests.
[dev-dependencies]
ljos = { path = "../ljos", default-features = false, features = ["testing"] }

[lints]
workspace = true
