[package]
name = "ljos_i18n"
description = "Localisation for Ljós: Qt-compatible catalogues, plural rules, .ts import and export, the .ljl runtime format and locale data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ICU4X (ARCHITECTURE.md §24: 2.3). `compiled_data` is their default feature;
# release builds move to datagen-trimmed blobs (§15), which is why every use
# of ICU4X stays behind this crate.
icu_plurals.workspace = true
icu_locale.workspace = true
icu_decimal.workspace = true
# Week information and weekday and month names, for the calendar types of
# QtQuick.Controls and `Locale.dayName`.
icu_calendar.workspace = true
icu_datetime.workspace = true
# Time zones by their IANA (or Windows) names, and the instant a zone's
# name is read at, for CLDR's zone names.
icu_time.workspace = true
# `localeCompare` and the facade's collator: the locale's alphabet, accents
# and case, as ICU orders them (what QCollator does). Its data adds about
# 1.2 MB to a stripped release binary, so it is a feature.
icu_collator = { workspace = true, optional = true }
writeable.workspace = true
# Only the `.ts` reader and writer use it; a shipped app that loads `.ljl`
# builds without the `ts` feature and does not link an XML parser.
quick-xml = { workspace = true, optional = true }
thiserror.workspace = true

# The local zone, its offset and its abbreviation, as the C library reads
# TZ and the zone database (tzfile(5)).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The zone the system is set to.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Time"] }

[features]
default = ["ts", "collation"]
ts = ["dep:quick-xml"]
# Text ordered by the locale's alphabet. Without it every locale orders
# text as the `C` locale does, by its UTF-16 code units.
collation = ["dep:icu_collator"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
