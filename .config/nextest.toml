# cargo-nextest runs each test in a process of its own, so one that hangs is
# stopped and named instead of holding its binary's run until the job's
# timeout ends it without a word.

[profile.default]
# Named as slow after a minute; a test still running after five is ended.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
# Every failure a runner has, in one run.
fail-fast = false
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
